# Deploy to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download PlantUML JAR
        run: |
          mkdir -p bin
          curl -L -o bin/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.2/plantuml-1.2025.2.jar

      - name: Build
        env:
          PUBLIC_CALENDAR_PROXY_URL: https://calendar.younote.top/api/calendar/apple-cn
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run build

      # 双部署到腾讯 EdgeOne Pages（中国大陆外全球加速节点，免费）。
      # 未配置 EDGEONE_API_TOKEN 时自动跳过，不影响 GitHub Pages 部署。
      - name: Deploy to EdgeOne Pages
        if: ${{ env.EDGEONE_API_TOKEN != '' }}
        run: npx edgeone pages deploy ./dist -n mountain-of-book -t "$EDGEONE_API_TOKEN"

      # 同步到自托管服务器（Caddy 静态托管）。
      # 需要两个仓库 Secret：SERVER_HOST（如 deploy@1.2.3.4）与 SERVER_SSH_KEY（deploy 用户私钥）。
      # 未配置时自动跳过，不影响其他部署。
      - name: Deploy to self-hosted server
        if: ${{ env.SERVER_HOST != '' && env.SERVER_SSH_KEY != '' }}
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete dist/ "$SSH_HOST":/var/www/mountain-of-book/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
