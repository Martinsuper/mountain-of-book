<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>待办页 · 三种设计方案</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--ink:#252b36;--muted:#7b8493;--line:#e8ebf0;--soft:#f3f5f8;--accent:#4968df;--tint:#edf1ff;--red:#c36969;--green:#578878;--amber:#ac894d;--gray:#8b93a1;color-scheme:light}
:root.dark{--bg:#141820;--surface:#1c222c;--ink:#e2e7ef;--muted:#939dac;--line:#2d3541;--soft:#232b37;--accent:#8ea5ff;--tint:#2a3451;--red:#db9696;--green:#8dbaa8;--amber:#cbb184;--gray:#a6afbd;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button,a,input,select{outline-offset:4px}button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px}button:hover{background:var(--soft)}a{color:inherit;text-decoration:none}.demo-bar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px}.demo-label{font-size:12px;color:var(--muted)}.switch{display:flex;gap:6px;flex-wrap:wrap}.switch button{font-size:12px}.switch .active{background:var(--ink);color:var(--surface);border-color:var(--ink)}.nav{max-width:1200px;margin:auto;display:flex;align-items:center;padding:24px 28px;gap:30px}.brand{font-weight:750;letter-spacing:2px;font-size:17px}.brand svg{vertical-align:middle;margin-right:9px;color:var(--accent)}.links{display:flex;gap:26px;color:var(--muted);font-size:13px}.links span:last-child{color:var(--ink)}.nav .theme{margin-left:auto;background:transparent;font-size:12px}main{max-width:1144px;margin:22px auto 60px;padding:0 28px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}.head{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:29px;letter-spacing:-1px;margin:0;font-weight:700}.subtitle{color:var(--muted);margin:7px 0 0;font-size:13px}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{filter:brightness(.94);background:var(--accent)}.actions{display:flex;align-items:center;gap:9px}.summary{margin:24px 0;display:flex;gap:24px;color:var(--muted);font-size:12px}.summary b{font-size:18px;color:var(--ink);margin-right:5px;font-weight:600}.summary .divider{width:1px;background:var(--line)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0}.search{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 13px;display:flex;gap:9px;align-items:center;width:230px;color:var(--muted)}.search input{border:0;background:transparent;min-width:0;width:100%;color:var(--ink);outline:none}.view-label{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.qhead{display:flex;align-items:center;gap:9px;padding:18px 19px 11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--q);flex-shrink:0}.qhead h2{font-size:14px;margin:0;font-weight:600}.count{color:var(--muted);font-size:11px;margin-left:auto;background:var(--soft);border-radius:5px;padding:1px 7px}.qdesc{font-size:11px;color:var(--muted);padding:0 19px 11px}.task{display:flex;gap:11px;padding:15px 19px;border-top:1px solid var(--line);align-items:flex-start}.task:hover{background:var(--soft)}.task input{appearance:none;width:16px;height:16px;border:1.5px solid var(--gray);border-radius:5px;margin:4px 0 0;flex-shrink:0;cursor:pointer}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked:after{content:'✓';display:block;color:#fff;font-size:11px;line-height:14px;text-align:center}.task .body{flex:1;min-width:0}.task-title{font-size:13px;font-weight:500;overflow-wrap:anywhere}.meta{display:flex;gap:9px;align-items:center;margin-top:5px;color:var(--muted);font-size:10px}.due{color:var(--red)}.tag{background:var(--soft);border-radius:4px;padding:1px 6px;color:var(--muted)}.add-inline{border:0;border-radius:0;width:100%;text-align:left;padding:12px 19px;color:var(--muted);font-size:12px;background:transparent}.empty{padding:23px 19px;color:var(--muted);font-size:12px}.aside{display:grid;gap:16px}.aside .panel{padding:19px}.section-title{font-size:13px;font-weight:600;margin:0 0 14px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px}.month button{padding:0 6px;border:0;background:transparent}.week,.mini{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:5px}.week{font-size:10px;color:var(--muted);margin-bottom:9px}.mini button{aspect-ratio:1;padding:0;border:0;font-size:11px;border-radius:7px;background:transparent;position:relative}.mini button.selected{background:var(--accent);color:#fff}.mini button.has-task:after{content:'';width:3px;height:3px;border-radius:50%;background:var(--accent);position:absolute;bottom:3px;left:calc(50% - 1.5px)}.mini button.selected:after{background:#fff}.mini .faded{color:var(--muted);opacity:.5}.agenda{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.agenda-item{display:flex;gap:10px;font-size:11px;margin-top:12px}.agenda-item time{color:var(--muted)}.focus-note{font-size:12px;color:var(--muted);margin:0}.progress{height:4px;background:var(--soft);border-radius:8px;overflow:hidden;margin:15px 0 8px}.progress div{background:var(--green);height:100%;width:40%}.archive{margin-top:20px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:17px}.archive summary{cursor:pointer}.archive .task{background:var(--surface)}.archive .task-title{text-decoration:line-through}.footer{display:flex;justify-content:space-between;margin-top:28px;color:var(--muted);font-size:11px;gap:15px}.note{background:var(--tint);color:var(--accent);border-radius:8px;padding:12px 16px;font-size:12px;margin-top:22px}.menu-wrap{position:relative}.menu{position:absolute;top:46px;right:0;z-index:5;width:160px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 24px #0001}.menu button{display:block;width:100%;border:0;text-align:left;font-size:12px}.hidden{display:none!important}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{border-color:transparent;background:transparent;font-size:12px;padding:6px 11px}.filters .active{background:var(--tint);color:var(--accent)}.list-panel .group-title{padding:15px 20px;font-size:11px;color:var(--muted);background:var(--soft);letter-spacing:1px}.list-panel .task{padding:19px 22px;align-items:center}.list-panel .meta{margin-top:4px}.list-panel .task .right-tag{font-size:10px;color:var(--q);flex-shrink:0}.list-panel .task-title{font-size:14px}.list-panel .add-inline{padding:16px 22px}.daily-head{border-left:3px solid var(--accent);padding-left:15px;margin:4px 0 24px}.daily-head h2{font-size:21px;margin:0}.daily-head p{font-size:12px;color:var(--muted);margin:5px 0}.schedule-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.big-calendar{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.big-top{padding:19px;display:flex;align-items:center;justify-content:space-between}.big-top h2{font-size:16px;margin:0}.big-week,.big-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.big-week{color:var(--muted);font-size:11px;text-align:center;padding:10px 0;border-top:1px solid var(--line)}.cell{min-height:100px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px;cursor:pointer;min-width:0}.cell:nth-child(7n){border-right:0}.cell:hover{background:var(--soft)}.cell.selected{background:var(--tint)}.cell .day{font-size:11px;color:var(--muted)}.cell.selected .day{color:var(--accent);font-weight:700}.event{font-size:9px;background:var(--soft);border-left:2px solid var(--q);padding:3px 5px;margin-top:7px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell.selected .event{background:var(--surface)}dialog{border:1px solid var(--line);border-radius:14px;padding:26px;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 32px))}dialog::backdrop{background:#0f172a55}dialog h2{margin:0 0 20px;font-size:19px}dialog label{display:block;font-size:12px;color:var(--muted);margin-top:14px}dialog input,dialog select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;background:var(--bg);color:var(--ink);margin-top:6px}dialog .actions{justify-content:flex-end;margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:9px;padding:11px 20px;font-size:12px;z-index:20}
@media(min-width:1500px){main{margin-top:45px}}@media(max-width:900px){.layout,.schedule-layout{grid-template-columns:1fr}.aside{grid-template-columns:1fr 1fr}.demo-bar{flex-direction:column;align-items:flex-start}.links{gap:15px}.cell{min-height:82px}}@media(max-width:600px){main{padding:0 18px;margin-top:12px}.nav{padding:20px 18px}.links{display:none}.matrix,.aside{grid-template-columns:1fr}.head{align-items:flex-start}h1{font-size:25px}.actions{gap:5px}.actions button{padding:7px 10px;font-size:12px}.toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.summary{gap:14px}.summary b{font-size:16px}.demo-bar{padding:12px 18px}.switch button{padding:6px 9px}.footer{flex-direction:column}.cell{min-height:72px;padding:5px}.event{font-size:8px;padding:2px}.list-panel .task .right-tag{max-width:70px}.schedule-layout{gap:15px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="demo-bar"><div><strong style="font-size:13px">待办页设计提案</strong><div class="demo-label">独立 HTML 原型 · 示例数据 · 不影响现有页面</div></div><div class="switch" aria-label="设计方案"><button data-mode="a" class="active">A · 轻量四象限</button><button data-mode="b">B · 专注清单</button><button data-mode="c">C · 日程工作台</button></div></div>
<nav class="nav" aria-label="站点导航示意"><div class="brand"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 19 8 6l4 8 3-5 7 10H2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>书山有路</div><div class="links"><span>文章</span><span>归档</span><span>工具</span><span>待办清单</span></div><button class="theme" id="theme">切换暗色</button></nav>
<main><div class="eyebrow" id="eyebrow">LESS NOISE, MORE FOCUS</div><header class="head"><div><h1 id="title">待办清单</h1><p class="subtitle" id="subtitle">分清轻重缓急，把时间留给重要的事。</p></div><div class="actions"><button class="primary" id="newTask">＋ 新任务</button><div class="menu-wrap"><button id="more" aria-label="更多操作" aria-expanded="false">···</button><div id="menu" class="menu hidden"><button id="export">导出示例 JSON</button><button id="reset">重置示例任务</button></div></div></div></header><div class="summary" id="summary"></div><div class="toolbar"><div id="viewControls" class="view-label">四象限视图 <span style="margin:0 10px;color:var(--line)">/</span> 按优先级安排</div><label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="搜索任务…" aria-label="搜索任务"></label></div><div id="content"></div><details class="archive"><summary id="archiveTitle">已完成</summary><div id="archiveTasks"></div></details><div class="note" id="designNote"></div><footer class="footer"><span>原型交互：搜索 / 完成任务 / 新增 / 日期选择 / 明暗切换</span><span>演示任务仅保留在当前页面，刷新即可恢复。</span></footer></main>
<dialog id="taskDialog"><form id="taskForm"><h2>添加新任务</h2><label>任务名称<input id="taskName" required maxlength="100" placeholder="下一件想完成的事" autocomplete="off"></label><label>任务象限<select id="taskQ"><option value="1">重要且紧急 · 立即处理</option><option value="2" selected>重要不紧急 · 计划安排</option><option value="3">紧急不重要 · 委托简化</option><option value="4">不紧急不重要 · 暂缓处理</option></select></label><label>截止日期<input type="date" id="taskDate" value="2026-05-18"></label><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">添加任务</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const qs=[null,{name:'重要且紧急',short:'立即处理',color:'var(--red)'},{name:'重要不紧急',short:'计划安排',color:'var(--accent)'},{name:'紧急不重要',short:'委托简化',color:'var(--amber)'},{name:'不紧急不重要',short:'暂缓处理',color:'var(--gray)'}];
const initial=[{id:1,title:'修复移动端文章目录遮挡',q:1,date:'2026-05-18',time:'10:00',tag:'博客维护'},{id:2,title:'完成 AI 工程实践文章初稿',q:1,date:'2026-05-18',time:'16:00',tag:'内容创作'},{id:3,title:'梳理个人知识库分类结构',q:2,date:'2026-05-20',time:'',tag:'知识整理'},{id:4,title:'阅读 Astro 内容集合文档',q:2,date:'2026-05-22',time:'',tag:'学习计划'},{id:5,title:'整理本周阅读笔记',q:2,date:'',time:'',tag:'个人成长'},{id:6,title:'回复文章评论与反馈',q:3,date:'2026-05-19',time:'11:00',tag:'日常事务'},{id:7,title:'整理浏览器收藏夹',q:4,date:'',time:'',tag:'稍后再做'},{id:8,title:'更新博客依赖版本',q:2,date:'2026-05-17',time:'',tag:'博客维护',done:true},{id:9,title:'发布 PlantUML 使用笔记',q:2,date:'2026-05-16',time:'',tag:'内容创作',done:true}];
let tasks=structuredClone(initial),mode='a',filter=0,selected=18,month=4,year=2026;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=d=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const matches=t=>t.title.toLowerCase().includes($('#search').value.trim().toLowerCase());
function row(t,list=false){return `<div class="task" style="--q:${qs[t.q].color}"><input type="checkbox" data-id="${t.id}" aria-label="${esc(t.title)}：标记完成" ${t.done?'checked':''}><div class="body"><div class="task-title">${esc(t.title)}</div><div class="meta"><span class="${t.date==='2026-05-18'?'due':''}">${t.date?(t.date==='2026-05-18'?'今天':`${Number(t.date.slice(5,7))} 月 ${Number(t.date.slice(8))} 日`)+(t.time?' · '+t.time:''):'未安排日期'}</span><span class="tag">${esc(t.tag)}</span></div></div>${list?`<span class="right-tag">${qs[t.q].name}</span>`:''}</div>`}
function calendar(large=false){const start=(new Date(year,month,1).getDay()+6)%7,days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate(),n=Math.ceil((start+days)/7)*7;let cells='';for(let i=0;i<n;i++){let d=i-start+1,valid=d>0&&d<=days,label=d<1?prev+d:d>days?d-days:d;let hits=valid?tasks.filter(t=>!t.done&&t.date===dateKey(d)):[];cells+=large?`<div class="cell ${valid&&selected===d?'selected':''}" ${valid?`data-day="${d}" role="button" tabindex="0" aria-label="选择 ${d} 日"`:''}><span class="day" style="${valid?'':'opacity:.4'}">${label}</span>${hits.slice(0,2).map(t=>`<div class="event" style="--q:${qs[t.q].color}">${esc(t.title)}</div>`).join('')}${hits.length>2?`<div class="meta">另 ${hits.length-2} 项</div>`:''}</div>`:`<button class="${valid?'':'faded'} ${valid&&selected===d?'selected':''} ${hits.length?'has-task':''}" ${valid?`data-day="${d}"`:'disabled'} aria-label="${month+1} 月 ${label} 日">${label}</button>`}return `${large?`<div class="big-top"><h2>${year} 年 ${month+1} 月</h2><div><button data-month="-1" aria-label="上个月">‹</button> <button data-month="1" aria-label="下个月">›</button></div></div>`:`<div class="month"><strong>${year} 年 ${month+1} 月</strong><div><button data-month="-1" aria-label="上个月">‹</button><button data-month="1" aria-label="下个月">›</button></div></div>`}<div class="${large?'big-week':'week'}">${['一','二','三','四','五','六','日'].map(d=>`<span>${d}</span>`).join('')}</div><div class="${large?'big-grid':'mini'}">${cells}</div>`}
function miniAside(){const hits=tasks.filter(t=>!t.done&&t.date===dateKey(selected));return `<aside class="aside"><section class="panel">${calendar()}<div class="agenda"><div class="section-title" style="margin-bottom:0">${month+1} 月 ${selected} 日 · ${hits.length} 项待办</div>${hits.length?hits.map(t=>`<div class="agenda-item"><time>${t.time||'全天'}</time><span>${esc(t.title)}</span></div>`).join(''):'<p class="focus-note" style="margin-top:10px">这一天还没有安排。</p>'}</div></section><section class="panel"><h2 class="section-title">留一点时间，给长期计划</h2><p class="focus-note">重要但不紧急的事，也值得被认真安排。</p><div class="progress"><div style="width:${tasks.filter(t=>t.done).length/tasks.length*100}%"></div></div><span class="demo-label">${tasks.filter(t=>t.done).length} / ${tasks.length} 项已完成</span></section></aside>`}
function render(){const pending=tasks.filter(t=>!t.done&&matches(t));$('#summary').innerHTML=`<span><b>${tasks.filter(t=>!t.done).length}</b>待办</span><span class="divider"></span><span><b>${tasks.filter(t=>!t.done&&t.date==='2026-05-18').length}</b>今天到期</span><span class="divider"></span><span><b>${tasks.filter(t=>t.done).length}</b>已完成</span>`;$('#viewControls').innerHTML=mode==='b'?`<div class="filters">${[0,1,2,3,4].map(q=>`<button data-filter="${q}" class="${filter===q?'active':''}">${q?qs[q].short:'全部任务'}</button>`).join('')}</div>`:mode==='a'?'四象限视图 <span style="margin:0 10px;color:var(--line)">/</span> 按优先级安排':'月度日程 <span style="margin:0 10px;color:var(--line)">/</span> 点击日期查看待办';
if(mode==='a'){$('#content').innerHTML=`<div class="layout"><div class="matrix">${[1,2,3,4].map(q=>{const ts=pending.filter(t=>t.q===q);return `<section class="panel" style="--q:${qs[q].color}"><div class="qhead"><span class="dot"></span><h2>${qs[q].name}</h2><span class="count">${ts.length}</span></div><div class="qdesc">${qs[q].short}</div>${ts.map(t=>row(t)).join('')||'<div class="empty">暂时没有任务，留一些余裕。</div>'}<button class="add-inline" data-add="${q}">＋ 添加任务</button></section>`}).join('')}</div>${miniAside()}</div>`}
else if(mode==='b'){const ts=pending.filter(t=>!filter||t.q===filter);const today=ts.filter(t=>t.date==='2026-05-18'),later=ts.filter(t=>t.date!=='2026-05-18');$('#content').innerHTML=`<div class="layout"><section class="panel list-panel">${today.length?`<div class="group-title">今天 · ${today.length} 项</div>${today.map(t=>row(t,true)).join('')}`:''}${later.length?`<div class="group-title">接下来 · ${later.length} 项</div>${later.map(t=>row(t,true)).join('')}`:''}${!ts.length?'<div class="empty">没有匹配的任务。</div>':''}<button class="add-inline" data-add="2">＋ 添加一件事</button></section>${miniAside()}</div>`}
else{const ts=pending.filter(t=>t.date===dateKey(selected));$('#content').innerHTML=`<div class="schedule-layout"><section class="big-calendar">${calendar(true)}</section><aside><div class="daily-head"><h2>${month+1} 月 ${selected} 日</h2><p>${ts.length} 件待办，按轻重缓急排列。</p></div><section class="panel">${ts.sort((a,b)=>a.q-b.q).map(t=>row(t)).join('')||'<div class="empty">今天没有安排，享受一点留白。</div>'}<button class="add-inline" data-add="2">＋ 为这一天添加任务</button></section><h3 class="section-title" style="margin-top:24px;color:var(--muted)">未安排日期</h3><section class="panel">${pending.filter(t=>!t.date).map(t=>row(t)).join('')||'<div class="empty">所有任务都已安排。</div>'}</section></aside></div>`}
$('#archiveTitle').textContent=`已完成 · ${tasks.filter(t=>t.done).length} 项`;$('#archiveTasks').innerHTML=tasks.filter(t=>t.done&&matches(t)).map(t=>row(t)).join('');$('#designNote').textContent={a:'方案 A：保留四象限，使用中性卡片和小色点区分优先级；缩小日历，常用操作前置，其他操作收进菜单。',b:'方案 B：以清单为核心，四象限改为筛选；减少容器嵌套，适合任务较多、希望快速浏览和完成的场景。',c:'方案 C：以月度日历为核心，右侧展示选中日期的待办；适合截止日期明确、需要统筹日程的场景。'}[mode]}
function openTask(q=2){$('#taskQ').value=q;$('#taskDate').value=mode==='c'?dateKey(selected):'2026-05-18';$('#taskDialog').showModal();$('#taskName').focus()}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===m));$('#title').textContent=mode==='b'?'把重要的事，一件件完成。':mode==='c'?'让每一件事，都有时间。':'待办清单';$('#subtitle').textContent=mode==='b'?'从今天开始，不必一次做完所有事情。':mode==='c'?'看清日程，也为自己保留一些空白。':'分清轻重缓急，把时间留给重要的事。';render()}const add=e.target.closest('[data-add]');if(add)openTask(add.dataset.add);const f=e.target.closest('[data-filter]');if(f){filter=Number(f.dataset.filter);render()}const d=e.target.closest('[data-day]');if(d){selected=Number(d.dataset.day);render()}const nav=e.target.closest('[data-month]');if(nav){const next=new Date(year,month+Number(nav.dataset.month),1);year=next.getFullYear();month=next.getMonth();selected=Math.min(selected,new Date(year,month+1,0).getDate());render()}if(!e.target.closest('.menu-wrap')){$('#menu').classList.add('hidden');$('#more').setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cell[data-day]')){e.preventDefault();selected=Number(e.target.dataset.day);render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-id]')){tasks.find(t=>t.id===Number(e.target.dataset.id)).done=e.target.checked;render()}});
$('#search').addEventListener('input',render);$('#newTask').onclick=()=>openTask();$('#cancel').onclick=()=>$('#taskDialog').close();$('#taskForm').onsubmit=e=>{e.preventDefault();const title=$('#taskName').value.trim();if(!title){$('#taskName').setCustomValidity('请输入任务名称');$('#taskName').reportValidity();return}tasks.push({id:Date.now(),title,q:Number($('#taskQ').value),date:$('#taskDate').value,time:'',tag:'新任务'});$('#taskDialog').close();$('#taskForm').reset();render()};$('#taskName').oninput=()=>$('#taskName').setCustomValidity('');$('#theme').onclick=()=>{document.documentElement.classList.toggle('dark');$('#theme').textContent=document.documentElement.classList.contains('dark')?'切换亮色':'切换暗色'};$('#more').onclick=()=>{const show=$('#menu').classList.toggle('hidden');$('#more').setAttribute('aria-expanded',String(!show))};$('#reset').onclick=()=>{tasks=structuredClone(initial);$('#search').value='';render();$('#menu').classList.add('hidden');$('#more').setAttribute('aria-expanded','false')};$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='todo-demo.json';a.click();URL.revokeObjectURL(url);$('#menu').classList.add('hidden');$('#more').setAttribute('aria-expanded','false')};
render();
</script>
